; llm_sirs.ini syntax
; comment: line start with # or ;, use ';' could let vim syntax highlight work
; indent level: prefix or postfix spaces will be trimmed
; value could be replace by environment variable by $ prefix, eg. $IP
; line format as key=value, where key is case insensitive.
; session name which enclosed in [] is case insensitive. 

[common]
# rx
rmm.rx.MaxMemoryAllowedKBytes=65536
rmm.rx.DataPort=8000

# tx
rmm.tx.MaxMemoryAllowedKBytes=66000
rmm.tx.MinimalHistoryKBytes=12000


[DMP090]
rmm.rx.app.enabled=1
;rmm.rx.MulticastLoop=1
rmm.rx.LogLevel=6
;rmm.rx.McastSocketTTL=1
rmm.rx.advanced.LogLevel=8
rmm.rx.advanced.LogFile=$LLM_RX_LOG
rmm.rx.advanced.SnapShotCycle=20000
rmm.topics.rx.app.numberOfTopics=4
rmm.topics.rx.1.topic_name=UNDERLY.TWSE.INDEX
rmm.topics.rx.1.address=$SIRS_RX1_IP
rmm.topics.rx.2.topic_name=UNDERLY.TWSE.NEWINDEX
rmm.topics.rx.2.address=$SIRS_RX2_IP
rmm.topics.rx.3.topic_name=UNDERLY.TWSE.STOCK
rmm.topics.rx.3.address=$SIRS_RX3_IP
rmm.topics.rx.4.topic_name=UNDERLY.TWSE.STOCKCLOSE
rmm.topics.rx.4.address=$SIRS_RX4_IP

[DMP090_1]
rmm.rx.MulticastInterface=$DMP090_1_IP

[DMP090_2]
rmm.rx.MulticastInterface=$DMP090_2_IP

[RMP]
rmm.rx.app.enabled=1
;rmm.rx.MulticastLoop=1
rmm.rx.LogLevel=6
;rmm.rx.McastSocketTTL=1
rmm.rx.advanced.LogLevel=8
rmm.rx.advanced.LogFile=$LLM_RX_LOG
rmm.rx.advanced.SnapShotCycle=20000
rmm.topics.rx.app.numberOfTopics=4
rmm.topics.rx.1.topic_name=UNDERLY.TWSE.INDEX
rmm.topics.rx.1.address=$SIRS_RX1_IP
rmm.topics.rx.2.topic_name=UNDERLY.TWSE.NEWINDEX
rmm.topics.rx.2.address=$SIRS_RX2_IP
rmm.topics.rx.3.topic_name=UNDERLY.TWSE.STOCK
rmm.topics.rx.3.address=$SIRS_RX3_IP
rmm.topics.rx.4.topic_name=UNDERLY.TWSE.STOCKCLOSE
rmm.topics.rx.4.address=$SIRS_RX4_IP

; rmm.rx.advanced.UseNoMA=0

[RMP_1]
rmm.rx.MulticastInterface=$RMP_1_IP

[RMP_2]
rmm.rx.MulticastInterface=$RMP_2_IP

[rap030]
rmm.rx.app.enabled=1
;rmm.rx.MulticastLoop=1
;rmm.rx.LogLevel=5
;rmm.rx.McastSocketTTL=1

rmm.topics.rx.app.numberOfTopics=2
rmm.topics.rx.1.topic_name=UNDERLY.TWSE.INDEX
rmm.topics.rx.1.address=$SIRS_RX1_IP
rmm.topics.rx.2.topic_name=UNDERLY.TWSE.STOCK
rmm.topics.rx.2.address=$SIRS_RX3_IP

; rmm.rx.advanced.UseNoMA=0

[rap030_1]
rmm.rx.MulticastInterface=$RAP030_1_IP

[rap030_2]
rmm.rx.MulticastInterface=$RAP030_2_IP

[stovol]
; ---- stovol 專用設定：只需要 1 個 topic ----
; 必須要有 rmm.rx.app.enabled=1 才會在 LLMParseConfigParameters() 建立 rxConfig
rmm.rx.app.enabled=1
; (可選) 設定 LogLevel，需要詳細可調大一點，例如 6 或 7
rmm.rx.LogLevel=6
; 訂閱的 topic 數量 (只要 1 個)
rmm.topics.rx.app.numberOfTopics=1
; Topic 1 名稱需與程式中 STOCK_TOPIC_NAME 對應 (請確認 STOCK_TOPIC_NAME 值)。
; 這裡假設你要的就是股票即時訊息，沿用其他 session 的 UNDERLY.TWSE.STOCK。
rmm.topics.rx.1.topic_name=UNDERLY.TWSE.STOCK
; multicast 位址，請確保環境變數 SIRS_RX3_IP 已 export，例如： export SIRS_RX3_IP=239.x.x.x:40000
rmm.topics.rx.1.address=127.0.0.1
; rmm.topics.rx.1.address=$SIRS_RX3_IP
; 若需要指定介面 (單介面情境) 可在這裡加：
; rmm.rx.MulticastInterface=$STOVOL_IP
; 亦可視需要加入進階參數：
; rmm.rx.advanced.LogLevel=8
; rmm.rx.advanced.LogFile=/tmp/stovol_llm_rx.log


